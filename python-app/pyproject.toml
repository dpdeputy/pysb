requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "python-app"
dynamic = ["version"]
description = "A standalone copier repo for a composable Python containerized app."
readme = "README.md"
requires-python = ">=3.8, <3.13"
authors = [
    { name = "Python App", email = "contact@example.com" }
]
dependencies = [
    "pydantic[email]",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "ruff",
    "mypy",
    "pre-commit",
    "mkdocs",
    "mkdocs-material",
]

[tool.ruff]
line-length = 100
fix = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "ASYNC", "S", "N", "ANN"]
ignore = ["E501", "ANN101", "ANN102"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["S101", "S603"]

[tool.mypy]
strict = true
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
disable_error_code = ["misc"]

[[tool.mypy.overrides]]
module = "tests.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests/unit",
    "tests/integration",
]
pythonpath = ["src"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
search_parent_directories = true

[tool.hatch.build.targets.wheel]
packages = ["src/python_app"]
