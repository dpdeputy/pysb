project_name:
  type: str
  help: What is your project name?

project_slug:
  type: str
  help: What is your project slug (package name)?
  default: "{{ project_name | lower | replace(' ', '-') }}"

project_description:
  type: str
  help: What is your project description?

author_email:
  type: str
  help: What is your email?
  default: contact@example.com

project_gitlab_url:
  type: str
  help: What is your project's GitLab URL?
  default: "https://gitlab.com/example/python-sandbox"

module_name:
  default: "{{ project_slug | replace('-', '_') }}"
  when: false
