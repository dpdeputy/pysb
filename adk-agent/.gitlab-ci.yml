stages:
  - build
  - test
  - release
  - deploy

.python-template: &python-template
  image: python:3.10
  before_script:
    - pip install uv
    - uv venv
    - source .venv/bin/activate
    - uv pip install -e .[dev]

lint:
  <<: *python-template
  stage: test
  script:
    - ruff check src tests

type-check:
  <<: *python-template
  stage: test
  script:
    - mypy src

test:
  stage: test
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.8", "3.10", "3.12"]
  image: python:$PYTHON_VERSION
  before_script:
    - pip install uv
    - uv venv
    - source .venv/bin/activate
    - uv pip install -e .[dev]
  script:
    - pytest

release:
  stage: release
  image: python:3.10
  before_script:
    - pip install hatch
  script:
    - hatch build
  rules:
    - if: $CI_COMMIT_TAG

pages:
  stage: deploy
  image: python:3.10
  before_script:
    - pip install uv
    - uv venv
    - source .venv/bin/activate
    - uv pip install -e .[dev]
  script:
    - mkdocs build
    - mv site public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_TAG
